[package]
name = "telescop"
version = "0.1.0"
edition = "2024"
description = "Native desktop image search application"
license = "MIT"
repository = "https://github.com/SM-Projetos/Telescop"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
scraper = "0.22"
slint = "1.14"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[build-dependencies]
slint-build = "1.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
