[package]
name = "telescop"
version = "0.1.0"
edition = "2024"
description = "Native desktop image search application with embedded Servo browser"
license = "MIT"
repository = "https://github.com/SM-Projetos/Telescop"
build = "build.rs"

[dependencies]
url = "2.5.7"
smol = "2.0.2"
glow = "0.17.0"
gleam = "0.15.1"
image = { version = "0.25.8", default-features = false }
winit = "0.30.12"
euclid = "0.22.11"
thiserror = "2.0.17"
surfman = "0.14.0"
servo = "0.7.0"
slint = { git = "https://github.com/slint-ui/slint", rev = "5fa335de646b0b0ef22f7dc500810da78354e6df", features = ["unstable-winit-030", "unstable-wgpu-30", "renderer-femtovg-wgpu"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38.0"

[build-dependencies]
gl_generator = "0.14.0"
slint-build = { git = "https://github.com/slint-ui/slint", rev = "5fa335de646b0b0ef22f7dc500810da78354e6df" }

[profile.release]
lto = true
codegen-units = 1
strip = true
